<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leonidas | Particle Field & Interactive Universe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030308;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
    }

    #universe {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 400px;
      overflow: hidden;
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 50%, #281027 0%, #110d19 42%, #05070d 100%);
    }

    #particles {
      position: absolute;
      inset: 0;

      touch-action: pan-y;
      cursor: crosshair;
    }

    .cosmic-dust {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: .22;
      background-image:
        radial-gradient(circle, #fff 0.6px, transparent 1px),
        radial-gradient(circle, #ff66cf 0.8px, transparent 1.5px);
      background-size: 83px 97px, 137px 113px;
      background-position: 20px 30px, 60px 80px;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.25) 65%, rgba(0,0,0,.85) 100%);
    }

    header, footer {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,.65);
      font-size: 10px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    header {
      top: 0;
    }

    footer {
      bottom: 0;
    }

    footer > div {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    footer strong {
      font-size: 13px;

    }

    footer small {
      font-size: 9px;
      opacity: .75;
      letter-spacing: 1.5px;
      color: #a9b1d6;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;

    }

    .live i {
      width: 6px;

      background: #45ffc0;

    }

    /* Minimal Profile Info Box */
    .dev-badge {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid #2a3447;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 11px;
      font-family: monospace;
      color: #e6edf3;
      letter-spacing: 1px;
      pointer-events: auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dev-badge a {
      color: #7aa2f7;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .dev-badge a:hover {
      color: #45ffc0;
    }

    button {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 30px;
      padding: 10px 18px;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: .25s;
    }

    button:hover {
      background: rgba(255,255,255,.22);
      border-color: white;
    }

    @media(max-width:600px) {
      header, footer {
        padding: 16px;
      }
      footer strong {
        font-size: 11px;
      }
      .dev-badge {
        font-size: 9px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>

<main id="universe">
  <canvas id="particles"></canvas>
  <div class="cosmic-dust"></div>
  <div class="vignette"></div>

  <header>
    <span>LEONIDAS • BOLIVIA (+591)</span>
    <span class="live"><i></i> SISTEMA ACTIVO</span>
  </header>

  <div class="dev-badge">
    <span>C# • PYTHON • JAVA • RUST • PODMAN • GO</span>
    <span>|</span>
    <a href="https://t.me/+59173902650" target="_blank">TELEGRAM</a>
    <a href="https://discord.gg/4DSrRk4CJS" target="_blank">DISCORD</a>
    <a href="https://github.com/leonidas854" target="_blank">GITHUB</a>
  </div>

  <footer>
    <div>
      <strong>LEONIDAS • PARTICLE UNIVERSE</strong>
      <small>DINÁMICA DE PARTÍCULAS Y VÓRTICES EN TIEMPO REAL</small>
    </div>
    <button id="reset">↻ REGENERAR</button>
  </footer>
</main>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d", { alpha: false });

let W, H, DPR;
let particles = [];
let strands = [];
let grid = new Map();
let pointer = { x: -9999, y: -9999, active: false };
let time = 0;
let lastTime = 0;
let animationId;

const CONFIG = {
  mainStrands: 27,
  branchStrands: 24,
  pointsPerStrand: 64,
  dustCount: 850,
  cellSize: 13,
  collisionRadius: 5.5,
  interactionRadius: 145,
  maxSpeed: 3.5,
  damping: 0.982,
  force: 0.48,
  waveSpeed: 0.0015
};

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function gaussian() {
  return (
    Math.random() + Math.random() +
    Math.random() + Math.random() - 2
  ) * 0.5;
}

function colorAt(x) {
  const t = clamp(x / W, 0, 1);
  const stops = [
    [255, 32, 155],
    [247, 76, 157],
    [255, 177, 91],
    [255, 222, 129],
    [69, 255, 184],
    [0, 190, 166]
  ];

  const f = t * (stops.length - 1);
  const i = Math.min(Math.floor(f), stops.length - 2);
  const k = f - i;

  return stops[i].map((v, j) =>
    Math.round(v + (stops[i + 1][j] - v) * k)
  );
}

function bezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u ** 3 * p0.x +
       3 * u ** 2 * t * p1.x +
       3 * u * t ** 2 * p2.x +
       t ** 3 * p3.x,
    y: u ** 3 * p0.y +
       3 * u ** 2 * t * p1.y +
       3 * u * t ** 2 * p2.y +
       t ** 3 * p3.y
  };
}

function makeStrand(startX, startY, endX, endY, depth, parent) {
  const p0 = { x: startX, y: startY };
  const p1 = {
    x: W * rand(.15, .48),
    y: startY + rand(-H * .38, H * .38)
  };
  const p2 = {
    x: W * rand(.52, .86),
    y: endY + rand(-H * .36, H * .36)
  };
  const p3 = { x: endX, y: endY };

  const strand = {
    id: strands.length,
    p0, p1, p2, p3,
    depth,
    parent,
    phase: rand(0, Math.PI * 2),
    width: rand(.35, 1.5),
    opacity: rand(.12, .48),
    frequency: rand(2, 7),
    amplitude: rand(.006, .035) * H,
    color: rand(0, 1)
  };

  strands.push(strand);

  for (let i = 0; i < CONFIG.pointsPerStrand; i++) {
    const t = i / (CONFIG.pointsPerStrand - 1);
    const point = bezier(p0, p1, p2, p3, t);
    const color = colorAt(point.x);

    particles.push({
      x: point.x + gaussian() * 3,
      y: point.y + gaussian() * 3,
      vx: 0,
      vy: 0,
      strandId: strand.id,
      index: i,
      t,
      radius: rand(.45, 1.8),
      alpha: rand(.3, .95),
      r: color[0],
      g: color[1],
      b: color[2],
      phase: rand(0, 6.28),
      seed: rand(0, 100)
    });
  }
}

function createNebula() {
  particles = [];
  strands = [];
  const centerY = H * .50;

  for (let i = 0; i < CONFIG.mainStrands; i++) {
    const offset = gaussian() * H * .19;
    makeStrand(
      -W * .08,
      centerY + offset,
      W * 1.08,
      centerY + gaussian() * H * .20,
      0,
      null
    );
  }

  const parents = [...strands];
  for (const parent of parents) {
    for (let b = 0; b < 1; b++) {
      if (Math.random() > .82) continue;
      const t = rand(.25, .85);
      const origin = bezier(
        parent.p0, parent.p1, parent.p2, parent.p3, t
      );
      const direction = Math.random() > .5 ? 1 : -1;
      makeStrand(
        origin.x,
        origin.y,
        clamp(origin.x + rand(90, W * .35), 0, W),
        clamp(origin.y + direction * rand(40, H * .34), -H * .1, H * 1.1),
        1,
        parent.id
      );
    }
  }

  for (let i = 0; i < CONFIG.dustCount; i++) {
    const x = rand(-20, W + 20);
    const color = colorAt(x);
    particles.push({
      x,
      y: rand(0, H),
      vx: rand(-.3, .3),
      vy: rand(-.3, .3),
      strandId: -1,
      index: -1,
      t: 0,
      radius: Math.random() < .04 ? rand(2, 5) : rand(.35, 1.3),
      alpha: rand(.15, .8),
      r: color[0],
      g: color[1],
      b: color[2],
      phase: rand(0, 6.28),
      seed: rand(0, 100)
    });
  }
}

function vortex(x, y, strength, radius, phase) {
  const angle = time * .00018 + phase;
  return {
    x: W * (x + Math.sin(angle) * .035),
    y: H * (y + Math.cos(angle * .8) * .06),
    strength,
    radius
  };
}

function getVortices() {
  return [
    vortex(.20, .62, 1.8, H * .32, 0),
    vortex(.53, .40, -2.2, H * .28, 2),
    vortex(.84, .35, 1.7, H * .34, 4)
  ];
}

function fieldForce(p, vortices) {
  let fx = 0;
  let fy = 0;
  const nx = p.x / W;
  const ny = p.y / H;

  const wave =
    Math.sin(nx * 13 + ny * 7 + time * .00035 + p.seed) +
    Math.cos(ny * 15 - nx * 8 - time * .00022);

  fx += Math.cos(wave * 2.1) * .38;
  fy += Math.sin(wave * 2.1) * .55;

  for (const v of vortices) {
    const dx = p.x - v.x;
    const dy = p.y - v.y;
    const d2 = dx * dx + dy * dy;
    const r2 = v.radius * v.radius;

    if (d2 > r2 * 5) continue;

    const d = Math.sqrt(d2) + .01;
    const influence = Math.exp(-d2 / r2);

    fx += (-dy / d) * v.strength * influence;
    fy += ( dx / d) * v.strength * influence;

    const radial = Math.sin(time * .001 + p.phase) * .22;
    fx -= dx / d * radial * influence;
    fy -= dy / d * radial * influence;
  }

  const wavePhase = p.x * .012 - time * CONFIG.waveSpeed + p.seed;
  const compression = Math.sin(wavePhase);

  fy += compression * .20;
  fx += Math.cos(wavePhase * .5) * .15;

  if (pointer.active) {
    const dx = p.x - pointer.x;
    const dy = p.y - pointer.y;
    const d2 = dx * dx + dy * dy;
    const radius = CONFIG.interactionRadius;

    if (d2 < radius * radius && d2 > 1) {
      const d = Math.sqrt(d2);
      const influence = 1 - d / radius;
      fx += dx / d * influence * 2.5;
      fy += dy / d * influence * 2.5;
      fx += -dy / d * influence * 1.2;
      fy += dx / d * influence * 1.2;
    }
  }

  return { fx, fy };
}

function buildGrid() {
  grid.clear();
  const size = CONFIG.cellSize;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const gx = Math.floor(p.x / size);
    const gy = Math.floor(p.y / size);
    const key = gx + "," + gy;

    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  }
}

function collisions() {
  const size = CONFIG.cellSize;

  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];
    const gx = Math.floor(a.x / size);
    const gy = Math.floor(a.y / size);

    for (let ox = -1; ox <= 1; ox++) {
      for (let oy = -1; oy <= 1; oy++) {
        const cell = grid.get((gx + ox) + "," + (gy + oy));
        if (!cell) continue;

        for (const j of cell) {
          if (j <= i) continue;
          const b = particles[j];

          let dx = a.x - b.x;
          let dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          const min = CONFIG.collisionRadius;

          if (d2 >= min * min || d2 < .001) continue;

          const d = Math.sqrt(d2);
          const force = (min - d) / d * .035;
          const nx = dx * force;
          const ny = dy * force;

          a.vx += nx;
          a.vy += ny;
          b.vx -= nx;
          b.vy -= ny;
        }
      }
    }
  }
}

function updateParticles(dt, vortices) {
  const damping = Math.pow(CONFIG.damping, dt);

  for (const p of particles) {
    const f = fieldForce(p, vortices);
    p.vx += f.fx * CONFIG.force * dt * .045;
    p.vy += f.fy * CONFIG.force * dt * .045;

    if (p.strandId >= 0) {
      const strand = strands[p.strandId];
      const target = bezier(
        strand.p0, strand.p1, strand.p2, strand.p3, p.t
      );
      const dx = target.x - p.x;
      const dy = target.y - p.y;
      const wave = Math.sin(
        p.t * strand.frequency * Math.PI * 2 +
        time * .001 + strand.phase
      );
      const pull = .0015 * (1 + strand.depth);

      p.vx += (dx + wave * strand.amplitude * .015) * pull * dt;
      p.vy += dy * pull * dt;
    }

    p.vx *= damping;
    p.vy *= damping;

    const speed = Math.hypot(p.vx, p.vy);
    if (speed > CONFIG.maxSpeed) {
      p.vx = p.vx / speed * CONFIG.maxSpeed;
      p.vy = p.vy / speed * CONFIG.maxSpeed;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
      p.x = rand(0, W);
      p.y = rand(0, H);
      p.vx = 0;
      p.vy = 0;
    }
  }
}

function drawFilaments() {
  ctx.globalCompositeOperation = "lighter";
  for (const strand of strands) {
    const points = particles.filter(p => p.strandId === strand.id);
    if (points.length < 2) continue;

    const gradient = ctx.createLinearGradient(
      strand.p0.x, strand.p0.y,
      strand.p3.x, strand.p3.y
    );

    gradient.addColorStop(0, "rgba(255,40,160,0.04)");
    gradient.addColorStop(.42, "rgba(255,130,115,0.22)");
    gradient.addColorStop(.63, "rgba(255,205,125,0.18)");
    gradient.addColorStop(1, "rgba(30,255,180,0.05)");

    ctx.beginPath();
    points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });

    ctx.strokeStyle = gradient;
    ctx.lineWidth = strand.width;
    ctx.globalAlpha = strand.opacity;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const pulse = .75 + Math.sin(time * .003 + p.phase) * .25;
    const alpha = p.alpha * pulse;

    ctx.beginPath();
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha})`;
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    if (p.radius > 2.5) {
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha * .12})`;
      ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
}

function render() {
  ctx.fillStyle = "rgba(3,3,8,0.14)";
  ctx.fillRect(0, 0, W, H);
  drawFilaments();
  drawParticles();
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CONFIG.mainStrands = W < 700 ? 18 : 27;
  CONFIG.branchStrands = W < 700 ? 16 : 24;
  CONFIG.pointsPerStrand = W < 700 ? 48 : 64;
  CONFIG.dustCount = W < 700 ? 450 : 850;

  createNebula();
  ctx.fillStyle = "#030308";
  ctx.fillRect(0, 0, W, H);
}

function animate(timestamp) {
  const dt = lastTime ? Math.min((timestamp - lastTime) / 16.67, 1.8) : 1;
  lastTime = timestamp;
  time = timestamp;

  const vortices = getVortices();
  buildGrid();
  collisions();
  updateParticles(dt, vortices);
  render();

  animationId = requestAnimationFrame(animate);
}

window.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = e.clientX - rect.left;
  pointer.y = e.clientY - rect.top;
  pointer.active = true;
});

window.addEventListener("pointerdown", e => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.active = true;
});

window.addEventListener("pointerleave", () => {
  pointer.active = false;
});

document.getElementById("reset").addEventListener("click", () => {
  createNebula();
});

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
