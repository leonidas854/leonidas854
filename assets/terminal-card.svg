<svg fill="none" viewBox="0 0 850 355" width="850" height="355" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="50%" stop-color="#110d19"/>
      <stop offset="100%" stop-color="#161824"/>
    </linearGradient>

    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#191b2a"/>
      <stop offset="100%" stop-color="#212438"/>
    </linearGradient>

    <style>
      .term-text { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; font-size: 12.5px; }
      .term-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #7aa2f7; }
      .key { fill: #45ffc0; font-weight: 600; }
      .colon { fill: #565f89; }
      .val { fill: #c0caf5; }
      .val-hl { fill: #7aa2f7; font-weight: 600; }
      .val-rust { fill: #e0af68; font-weight: 700; }
      .val-cloud { fill: #bb9af7; }
      .val-green { fill: #9ece6a; }
      .val-cyan { fill: #7dcfff; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #45ffc0; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="848" height="353" x="1" y="1" rx="14" fill="url(#term-bg)" stroke="#2b2f4a" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <path d="M 1 14 C 1 6.8 6.8 1 14 1 L 834 1 C 841.2 1 847 6.8 847 14 L 847 36 L 1 36 Z" fill="url(#term-header)"/>
  <line x1="1" y1="36" x2="847" y2="36" stroke="#2b2f4a" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="22" cy="18" r="5.5" fill="#f7768e"/>
  <circle cx="40" cy="18" r="5.5" fill="#e0af68"/>
  <circle cx="58" cy="18" r="5.5" fill="#9ece6a"/>

  <!-- Window Title -->
  <text x="425" y="22" text-anchor="middle" class="term-title">leonidas@devbox:~ (system-info)</text>

  <!-- Left Side: Stylized Monospace Terminal Logo -->
  <g transform="translate(30, 68)" class="term-text">
    <text x="0" y="20" fill="#7aa2f7">   __    ___ ___ </text>
    <text x="0" y="38" fill="#7aa2f7">  / /   / __/ _ \</text>
    <text x="0" y="56" fill="#45ffc0"> / /___/ _// // /</text>
    <text x="0" y="74" fill="#45ffc0">/_____/___/\___/ </text>
    <text x="0" y="96" fill="#bb9af7">====================</text>
    <text x="0" y="118" fill="#565f89">  ENGINEERING SPECS</text>
    <text x="0" y="138" fill="#7aa2f7">  • Backend &amp; APIs</text>
    <text x="0" y="158" fill="#45ffc0">  • Microservices</text>
    <text x="0" y="178" fill="#bb9af7">  • Linux &amp; OCI</text>
    <text x="0" y="198" fill="#e0af68">  • Rust Explorer</text>
    <text x="0" y="218" fill="#c0caf5">  • Location: BO 🇧🇴</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="260" y1="52" x2="260" y2="330" stroke="#252940" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Side: Developer Specs -->
  <g transform="translate(280, 52)" class="term-text">
    <!-- User / Role -->
    <text x="0" y="22">
      <tspan class="key">Developer</tspan><tspan class="colon">: </tspan>
      <tspan class="val-hl">Leonidas </tspan>
      <tspan class="val">(Software Engineer &amp; Full Stack)</tspan>
    </text>

    <!-- OS & Containers -->
    <text x="0" y="44">
      <tspan class="key">Containers &amp; OS</tspan><tspan class="colon">: </tspan>
      <tspan class="val">Linux (Debian/Arch) • Docker • </tspan>
      <tspan class="val-hl">Podman</tspan>
    </text>

    <!-- Core Languages -->
    <text x="0" y="66">
      <tspan class="key">Core Languages</tspan><tspan class="colon">: </tspan>
      <tspan class="val">C#, Python, Java, TypeScript, JavaScript, SQL, HTML/CSS</tspan>
    </text>

    <!-- Frameworks -->
    <text x="0" y="88">
      <tspan class="key">Frameworks</tspan><tspan class="colon">: </tspan>
      <tspan class="val">ASP.NET Core, Spring Boot, Next.js, OpenNext, React, Django, FastAPI, Laravel</tspan>
    </text>

    <!-- Active Learning -->
    <text x="0" y="110">
      <tspan class="key">Currently Learning</tspan><tspan class="colon">: </tspan>
      <tspan class="val-rust">🦀 Rust </tspan>
      <tspan class="val">(Ownership, concurrencia segura, sistemas de alto rendimiento)</tspan>
    </text>

    <!-- Cloud (Foundations) -->
    <text x="0" y="132">
      <tspan class="key">Cloud (Fundamentos)</tspan><tspan class="colon">: </tspan>
      <tspan class="val-cloud">AWS &amp; Google Cloud (GCP) </tspan>
      <tspan class="val">(Conceptos base, despliegues y servicios esenciales)</tspan>
    </text>

    <!-- Secondary / Expanding -->
    <text x="0" y="154">
      <tspan class="key">Other Tech</tspan><tspan class="colon">: </tspan>
      <tspan class="val">Golang, C++, PHP, Dart / Flutter</tspan>
    </text>

    <!-- Spoken Languages -->
    <text x="0" y="176">
      <tspan class="key">Languages</tspan><tspan class="colon">: </tspan>
      <tspan class="val-green">Español (Nativo) </tspan>
      <tspan class="val">| </tspan>
      <tspan class="val-cyan">English (A2 - En estudio y práctica activa)</tspan>
    </text>

    <!-- Color Palette -->
    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="22" height="12" rx="3" fill="#0c0e18"/>
      <rect x="28" y="0" width="22" height="12" rx="3" fill="#f7768e"/>
      <rect x="56" y="0" width="22" height="12" rx="3" fill="#9ece6a"/>
      <rect x="84" y="0" width="22" height="12" rx="3" fill="#e0af68"/>
      <rect x="112" y="0" width="22" height="12" rx="3" fill="#7aa2f7"/>
      <rect x="140" y="0" width="22" height="12" rx="3" fill="#bb9af7"/>
      <rect x="168" y="0" width="22" height="12" rx="3" fill="#45ffc0"/>
      <rect x="196" y="0" width="22" height="12" rx="3" fill="#c0caf5"/>
    </g>

    <!-- Realistic Terminal Prompt -->
    <text x="0" y="242">
      <tspan fill="#45ffc0">➜ </tspan>
      <tspan fill="#7aa2f7">~/projects </tspan>
      <tspan fill="#c0caf5">podman run -d --name api-service &amp;&amp; cargo check</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>
</svg>
