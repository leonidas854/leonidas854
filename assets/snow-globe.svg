<svg fill="none" viewBox="0 0 850 260" width="850" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="globe-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1128"/>
      <stop offset="50%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#040308"/>
    </radialGradient>

    <!-- Glass Dome Gradients -->
    <radialGradient id="glass-specular" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#7dcfff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#7aa2f7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.3"/>
    </radialGradient>

    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7aa2f7" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#45ffc0" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Brass Base Gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a421b"/>
      <stop offset="30%" stop-color="#e0af68"/>
      <stop offset="60%" stop-color="#fff1d0"/>
      <stop offset="85%" stop-color="#c99e4c"/>
      <stop offset="100%" stop-color="#4a3514"/>
    </linearGradient>

    <!-- Base Wood / Shadow -->
    <linearGradient id="pedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f182c"/>
      <stop offset="100%" stop-color="#0e0a16"/>
    </linearGradient>

    <!-- Snowflake Animations -->
    <style>
      .mono { font-family: 'SF Mono', Consolas, 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      @keyframes snow-fall-1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(115px) translateX(-18px); opacity: 0; }
      }

      @keyframes snow-fall-2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        25% { opacity: 0.85; }
        85% { opacity: 0.7; }
        100% { transform: translateY(110px) translateX(15px); opacity: 0; }
      }

      @keyframes glow-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }

      .flake-1 { animation: snow-fall-1 4.5s linear infinite; }
      .flake-2 { animation: snow-fall-2 5.5s linear infinite 1.2s; }
      .flake-3 { animation: snow-fall-1 6s linear infinite 2.5s; }
      .server-led { animation: glow-pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="848" height="258" x="1" y="1" rx="16" fill="url(#globe-bg)" stroke="#2b233d" stroke-width="1.2"/>

  <!-- Left: The Animated Snow Globe Assembly (Centered at x=145, y=125) -->
  <g transform="translate(40, 15)">
    <!-- Base Shadow -->
    <ellipse cx="110" cy="216" rx="85" ry="14" fill="#000000" opacity="0.6"/>

    <!-- Wood / Metal Pedestal Base -->
    <path d="M 45 200 L 175 200 L 185 214 L 35 214 Z" fill="url(#pedestal)" stroke="#382d4f" stroke-width="1"/>
    
    <!-- Brass Ring Collar -->
    <ellipse cx="110" cy="199" rx="66" ry="10" fill="url(#brass-grad)"/>
    <ellipse cx="110" cy="198" rx="64" ry="8" fill="#1c1626"/>

    <!-- Brass Nameplate -->
    <rect x="75" y="203" width="70" height="9" rx="2" fill="url(#brass-grad)"/>
    <text x="110" y="210" text-anchor="middle" font-size="6.5" font-weight="800" font-family="'SF Mono', monospace" fill="#1f1406">LEONIDAS</text>

    <!-- Globe Interior (Background Sky inside Sphere) -->
    <clipPath id="sphere-clip">
      <circle cx="110" cy="115" r="76"/>
    </clipPath>

    <g clip-path="url(#sphere-clip)">
      <!-- Sky inside globe -->
      <rect x="30" y="35" width="160" height="160" fill="#0c1022"/>
      
      <!-- Distant Mountains / Midnight Horizon -->
      <path d="M 30 155 Q 70 135 110 150 Q 150 130 190 155 L 190 200 L 30 200 Z" fill="#18203c"/>

      <!-- Snowy Ground / Hills inside globe -->
      <ellipse cx="110" cy="180" rx="74" ry="24" fill="#dce6f8"/>
      <ellipse cx="110" cy="184" rx="70" ry="18" fill="#f0f5fc"/>

      <!-- Conifer Pine Trees inside globe -->
      <!-- Tree Left -->
      <polygon points="68,168 62,152 74,152" fill="#26443b"/>
      <polygon points="68,154 63,142 73,142" fill="#2d5247"/>
      <polygon points="68,144 65,134 71,134" fill="#356154"/>
      <!-- Snow on Tree Left -->
      <polygon points="68,134 66,138 70,138" fill="#ffffff"/>
      <polygon points="68,144 64,146 72,146" fill="#ffffff"/>

      <!-- Center-Right Mini Server Rack / Dev Workstation Node -->
      <rect x="98" y="132" width="28" height="42" rx="3" fill="#111524" stroke="#7aa2f7" stroke-width="0.8"/>
      <!-- Server Rack Units & LEDs -->
      <line x1="102" y1="139" x2="122" y2="139" stroke="#2c3553" stroke-width="1.5"/>
      <line x1="102" y1="147" x2="122" y2="147" stroke="#2c3553" stroke-width="1.5"/>
      <line x1="102" y1="155" x2="122" y2="155" stroke="#2c3553" stroke-width="1.5"/>
      <line x1="102" y1="163" x2="122" y2="163" stroke="#2c3553" stroke-width="1.5"/>
      
      <!-- Glowing LEDs on Server -->
      <circle cx="103" cy="139" r="1.2" fill="#45ffc0" class="server-led"/>
      <circle cx="103" cy="147" r="1.2" fill="#7aa2f7" class="server-led"/>
      <circle cx="103" cy="155" r="1.2" fill="#e0af68" class="server-led"/>
      <circle cx="103" cy="163" r="1.2" fill="#45ffc0" class="server-led"/>

      <!-- Snow Roof on Server -->
      <path d="M 96 133 Q 112 129 128 133 L 126 136 Q 112 133 98 136 Z" fill="#ffffff"/>

      <!-- Tree Right -->
      <polygon points="144,170 138,154 150,154" fill="#26443b"/>
      <polygon points="144,156 139,144 149,144" fill="#2d5247"/>
      <polygon points="144,146 141,136 147,136" fill="#356154"/>
      <polygon points="144,136 142,140 146,140" fill="#ffffff"/>

      <!-- Swirling Blizzard Flakes inside the Globe -->
      <!-- Flake Group 1 -->
      <g class="flake-1">
        <circle cx="65" cy="45" r="1.5" fill="#ffffff"/>
        <circle cx="105" cy="55" r="2" fill="#ffffff"/>
        <circle cx="135" cy="48" r="1.2" fill="#ffffff"/>
        <circle cx="85" cy="70" r="1.6" fill="#ffffff"/>
        <circle cx="120" cy="78" r="1.8" fill="#ffffff"/>
        <circle cx="150" cy="65" r="1.3" fill="#ffffff"/>
      </g>

      <!-- Flake Group 2 -->
      <g class="flake-2">
        <circle cx="75" cy="50" r="1.3" fill="#ffffff"/>
        <circle cx="95" cy="62" r="1.7" fill="#ffffff"/>
        <circle cx="125" cy="52" r="1.4" fill="#ffffff"/>
        <circle cx="145" cy="72" r="2" fill="#ffffff"/>
        <circle cx="60" cy="80" r="1.5" fill="#ffffff"/>
        <circle cx="110" cy="90" r="1.2" fill="#ffffff"/>
      </g>

      <!-- Flake Group 3 -->
      <g class="flake-3">
        <circle cx="80" cy="42" r="1.8" fill="#ffffff"/>
        <circle cx="115" cy="45" r="1.2" fill="#ffffff"/>
        <circle cx="140" cy="58" r="1.6" fill="#ffffff"/>
        <circle cx="100" cy="75" r="1.4" fill="#ffffff"/>
        <circle cx="70" cy="85" r="2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Outer Glass Sphere & Reflections -->
    <circle cx="110" cy="115" r="76" fill="url(#glass-specular)" stroke="url(#glass-rim)" stroke-width="2"/>

    <!-- High-gloss Light Crescent (Reflection) -->
    <path d="M 58 72 A 74 74 0 0 1 125 43 A 70 70 0 0 0 68 85 Z" fill="#ffffff" opacity="0.38"/>
  </g>

  <!-- Right Side: Content & Interactive Simulator Reference -->
  <g transform="translate(290, 42)">
    <rect width="180" height="22" rx="11" fill="#141122" stroke="#bb9af7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="15" class="mono" font-size="9.5" font-weight="700" fill="#bb9af7" letter-spacing="1">INTERACTIVE SIMULATION</text>

    <!-- Main Headline -->
    <text x="0" y="52" class="sans" font-size="22" font-weight="800" fill="#ffffff">Esfera de Nieve &amp; Campo Cósmico 3D</text>

    <!-- Description (Grounded, direct, without generic buzzwords) -->
    <text x="0" y="80" class="sans" font-size="13" fill="#a9b1d6">
      Implementación inspirada en simuladores de partículas WebGL y Three.js.
    </text>
    <text x="0" y="100" class="sans" font-size="13" fill="#a9b1d6">
      Fusión de física de nieve tipo blizzard y fondos de nebulosa espacial orgánica.
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#16152a" stroke="#45ffc0" stroke-width="0.8"/>
      <text x="42.5" y="16" text-anchor="middle" class="mono" font-size="11" fill="#45ffc0">Three.js</text>

      <rect x="93" y="0" width="75" height="24" rx="6" fill="#16152a" stroke="#7aa2f7" stroke-width="0.8"/>
      <text x="130.5" y="16" text-anchor="middle" class="mono" font-size="11" fill="#7aa2f7">WebGL</text>

      <rect x="176" y="0" width="90" height="24" rx="6" fill="#16152a" stroke="#bb9af7" stroke-width="0.8"/>
      <text x="221" y="16" text-anchor="middle" class="mono" font-size="11" fill="#bb9af7">Canvas 2D</text>

      <rect x="274" y="0" width="130" height="24" rx="6" fill="#16152a" stroke="#e0af68" stroke-width="0.8"/>
      <text x="339" y="16" text-anchor="middle" class="mono" font-size="11" fill="#e0af68">CSS Randomness</text>
    </g>

    <!-- Interactive Link / Note -->
    <text x="0" y="176" class="sans" font-size="12" fill="#7dcfff" font-weight="600">
      🌐 Experimento disponible en la web interactiva del repositorio
    </text>
  </g>
</svg>
