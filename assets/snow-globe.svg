<svg fill="none" viewBox="0 0 850 310" width="850" height="310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid, crisp gradients without muddy AI blur -->
    <linearGradient id="brass-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5522"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fff1b8"/>
      <stop offset="100%" stop-color="#7a5522"/>
    </linearGradient>

    <linearGradient id="glass-specular-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes snow-fall-fast {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        20% { opacity: 0.95; }
        85% { opacity: 0.85; }
        100% { transform: translateY(140px) translateX(-25px); opacity: 0; }
      }

      @keyframes snow-fall-slow {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        25% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(135px) translateX(20px); opacity: 0; }
      }

      @keyframes chimney-smoke {
        0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
        100% { transform: translateY(-24px) scale(1.6); opacity: 0; }
      }

      .snow-flurry-1 { animation: snow-fall-fast 4s linear infinite; }
      .snow-flurry-2 { animation: snow-fall-slow 5.5s linear infinite 1.2s; }
      .smoke-puff { transform-box: fill-box; transform-origin: center; animation: chimney-smoke 2.5s ease-out infinite; }
    </style>
  </defs>

  <!-- Solid Background Card -->
  <rect width="848" height="308" x="1" y="1" rx="14" fill="#090b10" stroke="#1d2330" stroke-width="1.5"/>

  <!-- ==================== BOLA DE NIEVE (x=135, y=145) ==================== -->
  <g transform="translate(30, 15)">
    <!-- Shadow beneath globe -->
    <ellipse cx="120" cy="265" rx="95" ry="14" fill="#000000" opacity="0.6"/>

    <!-- Pedestal Base (Madera / Latón sólido) -->
    <path d="M 45 245 L 195 245 L 205 264 L 35 264 Z" fill="#181a24" stroke="#2a3042" stroke-width="1.2"/>
    
    <!-- Anillo Superior de Latón -->
    <ellipse cx="120" cy="245" rx="76" ry="10" fill="url(#brass-base)"/>
    <ellipse cx="120" cy="244" rx="74" ry="8" fill="#12151e"/>

    <!-- Placa de latón con nombre grabado -->
    <rect x="80" y="250" width="80" height="11" rx="2" fill="url(#brass-base)"/>
    <text x="120" y="258" text-anchor="middle" font-size="7.5" font-weight="800" class="mono" fill="#291a05">LEONIDAS</text>

    <!-- Clip Path para el interior esférico de cristal -->
    <clipPath id="dome-clip">
      <circle cx="120" cy="145" r="95"/>
    </clipPath>

    <!-- INTERIOR DE LA BOLA DE NIEVE -->
    <g clip-path="url(#dome-clip)">
      <!-- Cielo nocturno interior -->
      <rect x="20" y="45" width="200" height="200" fill="#0b0f19"/>

      <!-- Montañas nevadas lejanas -->
      <polygon points="20,185 70,140 120,185" fill="#1a233a"/>
      <polygon points="60,149 70,140 80,149" fill="#e6edf3"/>
      <polygon points="90,185 140,135 190,185" fill="#151c2e"/>
      <polygon points="130,144 140,135 150,144" fill="#e6edf3"/>

      <!-- Suelo Nevado con Colinas Suaves -->
      <ellipse cx="120" cy="225" rx="92" ry="26" fill="#e2ebf5"/>
      <ellipse cx="120" cy="230" rx="88" ry="20" fill="#f8fafc"/>

      <!-- Pinos Nevados en el Fondo -->
      <polygon points="45,195 38,175 52,175" fill="#1b4332"/>
      <polygon points="45,178 40,165 50,165" fill="#2d6a4f"/>
      <polygon points="45,165 42,156 48,156" fill="#ffffff"/>

      <polygon points="195,195 188,175 202,175" fill="#1b4332"/>
      <polygon points="195,178 190,165 200,165" fill="#2d6a4f"/>
      <polygon points="195,165 192,156 198,156" fill="#ffffff"/>

      <!-- ==================== CASA 1: CABAÑA RUST 🦀 ==================== -->
      <g transform="translate(48, 160)">
        <!-- Humo de chimenea animado -->
        <circle cx="9" cy="-14" r="2.5" fill="#ffffff" class="smoke-puff"/>
        <circle cx="10" cy="-20" r="3.2" fill="#ffffff" class="smoke-puff" style="animation-delay: 0.8s;"/>

        <!-- Chimenea -->
        <rect x="6" y="-10" width="6" height="12" fill="#4a5568"/>
        <rect x="5" y="-10" width="8" height="2" fill="#ffffff"/>

        <!-- Paredes de Madera Cabaña -->
        <rect x="4" y="2" width="34" height="28" fill="#5c3826" stroke="#3d2417" stroke-width="1"/>
        
        <!-- Techo a dos aguas con nieve gruesa -->
        <polygon points="21,-8 0,6 42,6" fill="#784830"/>
        <!-- Capa de nieve en el techo -->
        <path d="M 0,6 Q 21,-12 42,6 L 41,2 Q 21,-14 1,2 Z" fill="#ffffff"/>

        <!-- Ventana cálida iluminada -->
        <rect x="8" y="10" width="8" height="8" rx="1" fill="#ffbe3b"/>
        <line x1="12" y1="10" x2="12" y2="18" stroke="#5c3826" stroke-width="0.8"/>
        <line x1="8" y1="14" x2="16" y2="14" stroke="#5c3826" stroke-width="0.8"/>

        <!-- Puerta -->
        <rect x="22" y="12" width="10" height="18" fill="#3d2417"/>

        <!-- Logo / Emblema RUST 🦀 sobre la puerta -->
        <circle cx="27" cy="8" r="4.5" fill="#f74c00"/>
        <text x="27" y="10.2" text-anchor="middle" font-size="4.2" font-weight="900" class="mono" fill="#ffffff">R</text>
      </g>

      <!-- ==================== CASA 2: LAB / ALMACÉN PODMAN 🦭 ==================== -->
      <g transform="translate(136, 162)">
        <!-- Edificio Contenedor Podman -->
        <rect x="2" y="4" width="38" height="26" rx="2" fill="#241a38" stroke="#892ca0" stroke-width="1.2"/>
        
        <!-- Techo plano con nieve gruesa -->
        <rect x="0" y="2" width="42" height="4" rx="2" fill="#ffffff"/>

        <!-- Logo Podman en la fachada (Foca púrpura / Contenedor) -->
        <rect x="8" y="8" width="12" height="12" rx="2" fill="#892ca0"/>
        <circle cx="14" cy="14" r="3" fill="#ffffff"/>
        <circle cx="15" cy="13.5" r="1.2" fill="#892ca0"/>

        <!-- Ventanas tecnológicas del lab con luz cian -->
        <rect x="24" y="9" width="10" height="6" rx="1" fill="#45ffc0"/>
        <line x1="29" y1="9" x2="29" y2="15" stroke="#241a38" stroke-width="0.8"/>

        <!-- Puerta de acceso de servidores -->
        <rect x="23" y="18" width="12" height="12" fill="#161022"/>
        <circle cx="26" cy="24" r="1" fill="#45ffc0"/>
        <circle cx="31" cy="24" r="1" fill="#ff6b6b"/>
      </g>

      <!-- ==================== PERSONAJE: GOLANG GOPHER 🐹 ==================== -->
      <g transform="translate(98, 192)">
        <!-- Gopher Body (Color oficial Go Cyan #00ADD8) -->
        <ellipse cx="14" cy="18" rx="8" ry="10" fill="#00add8"/>

        <!-- Orejas -->
        <circle cx="7" cy="10" r="2.8" fill="#00add8"/>
        <circle cx="7" cy="10" r="1.5" fill="#f8d7da"/>
        <circle cx="21" cy="10" r="2.8" fill="#00add8"/>
        <circle cx="21" cy="10" r="1.5" fill="#f8d7da"/>

        <!-- Ojos Saltones Grandes -->
        <circle cx="10" cy="14" r="3.2" fill="#ffffff" stroke="#0083a8" stroke-width="0.5"/>
        <circle cx="11" cy="14" r="1.6" fill="#1b1b1b"/>
        <circle cx="18" cy="14" r="3.2" fill="#ffffff" stroke="#0083a8" stroke-width="0.5"/>
        <circle cx="17" cy="14" r="1.6" fill="#1b1b1b"/>

        <!-- Hocico y Dientes -->
        <ellipse cx="14" cy="18" rx="2.5" ry="1.8" fill="#f8d7da"/>
        <circle cx="14" cy="17" r="1.2" fill="#1b1b1b"/>
        <rect x="13" y="19" width="2" height="1.8" fill="#ffffff"/>

        <!-- Bufanda invernal roja -->
        <rect x="7" y="21" width="14" height="3" rx="1.5" fill="#ff4d4d"/>
        <rect x="15" y="23" width="3" height="6" rx="1" fill="#ff4d4d"/>

        <!-- Patitas / Manos sosteniendo café caliente -->
        <ellipse cx="8" cy="21" rx="2" ry="1.5" fill="#00add8"/>
        <ellipse cx="20" cy="21" rx="2" ry="1.5" fill="#00add8"/>
        <!-- Taza de café -->
        <rect x="18" y="19" width="3.5" height="4" rx="1" fill="#ffffff"/>
      </g>

      <!-- ==================== DESARROLLADOR EN ABRIGO (Bolivia) ==================== -->
      <g transform="translate(122, 188)">
        <!-- Gorro invernal con pompón -->
        <path d="M 4,7 Q 8,1 12,7 Z" fill="#5865f2"/>
        <circle cx="8" cy="2" r="1.8" fill="#ffffff"/>
        <rect x="3" y="6" width="10" height="2.5" rx="1" fill="#ffffff"/>

        <!-- Rostro -->
        <circle cx="8" cy="10" r="3.5" fill="#fcd5b5"/>
        <circle cx="7" cy="10" r="0.6" fill="#2d3748"/>
        <circle cx="9.5" cy="10" r="0.6" fill="#2d3748"/>

        <!-- Abrigo de invierno / Parka -->
        <path d="M 3,13 L 13,13 L 14,24 L 2,24 Z" fill="#2b6cb0"/>
        
        <!-- Brazo saludando 👋 -->
        <line x1="13" y1="15" x2="17" y2="10" stroke="#2b6cb0" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="17.5" cy="9.5" r="1.5" fill="#fcd5b5"/>

        <!-- Bufanda -->
        <rect x="4" y="12" width="8" height="2" fill="#e2af3b"/>
      </g>

      <!-- ==================== VENTISCA DE NIEVE (BLIZZARD) ==================== -->
      <g class="snow-flurry-1">
        <circle cx="45" cy="40" r="1.5" fill="#ffffff"/>
        <circle cx="80" cy="55" r="2" fill="#ffffff"/>
        <circle cx="125" cy="48" r="1.3" fill="#ffffff"/>
        <circle cx="160" cy="62" r="1.8" fill="#ffffff"/>
        <circle cx="65" cy="85" r="1.4" fill="#ffffff"/>
        <circle cx="105" cy="95" r="2.2" fill="#ffffff"/>
        <circle cx="145" cy="80" r="1.5" fill="#ffffff"/>
        <circle cx="175" cy="100" r="1.3" fill="#ffffff"/>
      </g>

      <g class="snow-flurry-2">
        <circle cx="55" cy="50" r="1.6" fill="#ffffff"/>
        <circle cx="95" cy="45" r="1.3" fill="#ffffff"/>
        <circle cx="140" cy="60" r="2" fill="#ffffff"/>
        <circle cx="75" cy="105" r="1.7" fill="#ffffff"/>
        <circle cx="120" cy="115" r="1.4" fill="#ffffff"/>
        <circle cx="165" cy="110" r="1.8" fill="#ffffff"/>
        <circle cx="185" cy="75" r="1.2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Cristal exterior de la esfera con reflejo curvo (Sin degradados borrosos) -->
    <circle cx="120" cy="145" r="95" fill="none" stroke="#7aa2f7" stroke-width="1.8" stroke-opacity="0.4"/>
    
    <!-- Reflejo nítido de luz en el vidrio superior izquierdo -->
    <path d="M 52,95 A 92 92 0 0 1 135,56 A 88 88 0 0 0 65,108 Z" fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- ==================== LADO DERECHO: DETALLES TÉCNICOS ==================== -->
  <g transform="translate(305, 38)">
    <!-- Header técnico limpio (Sin la palabra 'experimental') -->
    <rect width="180" height="22" rx="4" fill="#131722" stroke="#2b3347" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#f74c00"/>
    <text x="24" y="15" class="mono" font-size="10" font-weight="700" fill="#e6edf3" letter-spacing="1">RUST • GO • PODMAN</text>

    <!-- Título Principal con color blanco sólido (Sin degradado degradado AI) -->
    <text x="0" y="56" class="sans" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
      Ecosistema de Software &amp; Contenedores
    </text>

    <!-- Descripción técnica nítida y humana -->
    <text x="0" y="86" class="sans" font-size="13.5" font-weight="400" fill="#c0caf5">
      Desarrollo de servicios backend de alto rendimiento, microservicios aislados
    </text>
    <text x="0" y="106" class="sans" font-size="13.5" font-weight="400" fill="#c0caf5">
      sin privilegios root con Podman, y programación concurrente con Rust y Go.
    </text>

    <!-- Badges de Tecnologías con Colores Oficiales Sólidos -->
    <g transform="translate(0, 130)">
      <!-- Rust -->
      <rect x="0" y="0" width="85" height="26" rx="5" fill="#1c110e" stroke="#f74c00" stroke-width="1.2"/>
      <text x="42.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f74c00">🦀 Rust</text>

      <!-- Go / Golang -->
      <rect x="93" y="0" width="76" height="26" rx="5" fill="#0c1720" stroke="#00add8" stroke-width="1.2"/>
      <text x="131" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00add8">Golang</text>

      <!-- Podman -->
      <rect x="177" y="0" width="85" height="26" rx="5" fill="#1c1226" stroke="#892ca0" stroke-width="1.2"/>
      <text x="219.5" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#d28cf5">Podman</text>

      <!-- Docker -->
      <rect x="270" y="0" width="76" height="26" rx="5" fill="#0d1724" stroke="#2496ed" stroke-width="1.2"/>
      <text x="308" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#2496ed">Docker</text>

      <!-- C# -->
      <rect x="354" y="0" width="58" height="26" rx="5" fill="#141124" stroke="#512bd4" stroke-width="1.2"/>
      <text x="383" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">C#</text>

      <!-- Python -->
      <rect x="420" y="0" width="72" height="26" rx="5" fill="#111924" stroke="#3776ab" stroke-width="1.2"/>
      <text x="456" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">Python</text>
    </g>

    <!-- Enlace directo limpio a la simulación interactiva -->
    <g transform="translate(0, 185)">
      <rect width="250" height="30" rx="6" fill="#161b26" stroke="#45ffc0" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#45ffc0"/>
      <text x="30" y="19" class="mono" font-size="11" font-weight="700" fill="#45ffc0">ABRIR SIMULACIÓN EN VIVO ↗</text>
    </g>

    <!-- Subtexto aclaratorio -->
    <text x="0" y="240" class="sans" font-size="12" fill="#8b949e">
      Física de partículas y simulación de fluidos cósmicos disponible en GitHub Pages.
    </text>
  </g>
</svg>
