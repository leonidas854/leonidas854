<svg fill="none" viewBox="0 0 850 260" width="850" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cosmic Nebula Radial Gradients -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#281027"/>
      <stop offset="42%" stop-color="#110d19"/>
      <stop offset="100%" stop-color="#030308"/>
    </radialGradient>

    <radialGradient id="nebula-magenta" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff3399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff3399" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-cyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#45ffc0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#45ffc0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-blue" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7aa2f7"/>
      <stop offset="70%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#45ffc0"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66cf" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#45ffc0" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      .hero-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: url(#title-grad);
      }
      
      .hero-sub {
        font-size: 13.5px;
        font-weight: 400;
        fill: #c0caf5;
        letter-spacing: 0.2px;
      }

      .badge-txt {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #45ffc0;
      }

      .chip-txt {
        font-size: 11px;
        font-weight: 600;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }

      @keyframes blizzard-drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-80px, 120px); }
      }

      .star-twinkle-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-twinkle-2 { animation: twinkle 4.5s ease-in-out infinite 1s; }
      .star-twinkle-3 { animation: twinkle 2.5s ease-in-out infinite 1.8s; }
      .snow-layer { animation: blizzard-drift 9s linear infinite; }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="848" height="258" x="1" y="1" rx="16" fill="url(#space-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Nebulae layers -->
  <rect width="848" height="258" x="1" y="1" rx="16" fill="url(#nebula-magenta)" />
  <rect width="848" height="258" x="1" y="1" rx="16" fill="url(#nebula-cyan)" />
  <rect width="848" height="258" x="1" y="1" rx="16" fill="url(#nebula-blue)" />

  <!-- Cosmic Stars & Dust Particles -->
  <g class="star-twinkle-1">
    <circle cx="95" cy="45" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="180" cy="85" r="1.5" fill="#45ffc0" opacity="0.9"/>
    <circle cx="310" cy="30" r="1" fill="#ff66cf" opacity="0.7"/>
    <circle cx="480" cy="40" r="1.4" fill="#ffffff" opacity="0.8"/>
    <circle cx="650" cy="75" r="1.2" fill="#7aa2f7" opacity="0.9"/>
    <circle cx="760" cy="45" r="1.6" fill="#45ffc0" opacity="0.75"/>
    <circle cx="810" cy="110" r="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <g class="star-twinkle-2">
    <circle cx="50" cy="180" r="1.4" fill="#7aa2f7" opacity="0.8"/>
    <circle cx="140" cy="220" r="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="260" cy="190" r="1.6" fill="#ff66cf" opacity="0.85"/>
    <circle cx="590" cy="210" r="1.2" fill="#45ffc0" opacity="0.8"/>
    <circle cx="710" cy="190" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="780" cy="225" r="1.2" fill="#7aa2f7" opacity="0.85"/>
  </g>

  <g class="star-twinkle-3">
    <circle cx="70" cy="110" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="230" cy="60" r="1.2" fill="#7aa2f7" opacity="0.75"/>
    <circle cx="390" cy="25" r="1.5" fill="#45ffc0" opacity="0.85"/>
    <circle cx="530" cy="220" r="1" fill="#ff66cf" opacity="0.7"/>
    <circle cx="680" cy="140" r="0.9" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Blizzard Flakes (Diagonal Wind Angle) -->
  <g opacity="0.45" class="snow-layer">
    <ellipse cx="120" cy="30" rx="1.2" ry="3" transform="rotate(-28 120 30)" fill="#ffffff"/>
    <ellipse cx="280" cy="50" rx="1.5" ry="3.8" transform="rotate(-30 280 50)" fill="#ffffff"/>
    <ellipse cx="440" cy="20" rx="1.1" ry="2.8" transform="rotate(-28 440 20)" fill="#ffffff"/>
    <ellipse cx="620" cy="40" rx="1.4" ry="3.5" transform="rotate(-32 620 40)" fill="#ffffff"/>
    <ellipse cx="730" cy="25" rx="1.6" ry="4" transform="rotate(-28 730 25)" fill="#ffffff"/>
    <ellipse cx="190" cy="140" rx="1" ry="2.5" transform="rotate(-30 190 140)" fill="#ffffff"/>
    <ellipse cx="360" cy="160" rx="1.3" ry="3.2" transform="rotate(-28 360 160)" fill="#ffffff"/>
    <ellipse cx="510" cy="130" rx="1.5" ry="3.8" transform="rotate(-30 510 130)" fill="#ffffff"/>
    <ellipse cx="690" cy="150" rx="1.2" ry="3" transform="rotate(-28 690 150)" fill="#ffffff"/>
    <ellipse cx="820" cy="170" rx="1.4" ry="3.5" transform="rotate(-32 820 170)" fill="#ffffff"/>
  </g>

  <!-- Status Indicator: LIVE DEV ENVIRONMENT -->
  <g transform="translate(330, 24)">
    <rect width="190" height="24" rx="12" fill="#0c0e18" stroke="#45ffc0" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#45ffc0" class="star-twinkle-1"/>
    <text x="28" y="15.5" class="mono badge-txt">LEONIDAS • BOLIVIA</text>
  </g>

  <!-- Left Tech Chip: Containers (Docker & Podman) -->
  <g transform="translate(42, 35)">
    <rect width="168" height="26" rx="13" fill="#0e111d" stroke="#7aa2f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="84" y="17" text-anchor="middle" class="mono chip-txt" fill="#7aa2f7">🐳 Docker &amp; Podman</text>
  </g>

  <!-- Left Tech Chip 2: Cloud Foundations -->
  <g transform="translate(42, 195)">
    <rect width="168" height="26" rx="13" fill="#0e111d" stroke="#bb9af7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="84" y="17" text-anchor="middle" class="mono chip-txt" fill="#bb9af7">☁️ AWS &amp; GCP (Básico)</text>
  </g>

  <!-- Right Tech Chip 1: Rust Explorer -->
  <g transform="translate(640, 35)">
    <rect width="168" height="26" rx="13" fill="#0e111d" stroke="#e0af68" stroke-opacity="0.5" stroke-width="1"/>
    <text x="84" y="17" text-anchor="middle" class="mono chip-txt" fill="#e0af68">🦀 Aprendiendo Rust</text>
  </g>

  <!-- Right Tech Chip 2: Modern Full-Stack -->
  <g transform="translate(640, 195)">
    <rect width="168" height="26" rx="13" fill="#0e111d" stroke="#45ffc0" stroke-opacity="0.4" stroke-width="1"/>
    <text x="84" y="17" text-anchor="middle" class="mono chip-txt" fill="#45ffc0">&lt;/&gt; ASP.NET &amp; React</text>
  </g>

  <!-- Main Title -->
  <text x="425" y="104" text-anchor="middle" class="sans hero-title">Leonidas | Software Engineer</text>

  <!-- Subtitle -->
  <text x="425" y="134" text-anchor="middle" class="sans hero-sub">Desarrollo Backend &amp; Full Stack • Arquitectura de Software • APIs RESTful</text>

  <!-- Core Tech Badges Center -->
  <g transform="translate(145, 156)">
    <!-- C# -->
    <rect x="0" y="0" width="46" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="23" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">C#</text>

    <!-- Python -->
    <rect x="54" y="0" width="66" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="87" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">Python</text>

    <!-- Java -->
    <rect x="128" y="0" width="54" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="155" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">Java</text>

    <!-- TypeScript -->
    <rect x="190" y="0" width="94" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="237" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">TypeScript</text>

    <!-- SQL -->
    <rect x="292" y="0" width="52" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="318" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">SQL</text>

    <!-- Next.js & React -->
    <rect x="352" y="0" width="112" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="408" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">Next.js • React</text>

    <!-- Spring Boot -->
    <rect x="472" y="0" width="90" height="22" rx="6" fill="#141829" stroke="#7aa2f7" stroke-width="0.8"/>
    <text x="517" y="15" text-anchor="middle" class="mono chip-txt" fill="#c0caf5">Spring Boot</text>
  </g>

  <!-- Subtle Bottom Line with Cosmic Gradient -->
  <line x1="260" y1="218" x2="590" y2="218" stroke="url(#title-grad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
