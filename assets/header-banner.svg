<svg fill="none" viewBox="0 0 850 250" width="850" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid, crisp linear gradients for particle strands -->
    <linearGradient id="strand-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="45%" stop-color="#45ffc0"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="strand-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2097"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>

    <linearGradient id="strand-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.3); opacity: 1; }
      }

      @keyframes drift-strand-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      @keyframes drift-strand-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      .animated-strand-1 { animation: drift-strand-1 6s ease-in-out infinite; }
      .animated-strand-2 { animation: drift-strand-2 7.5s ease-in-out infinite 1s; }
      .node { transform-box: fill-box; transform-origin: center; animation: pulse-node 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Solid Background (Sin degradados borrosos) -->
  <rect width="848" height="248" x="1" y="1" rx="14" fill="#080a10" stroke="#1f2430" stroke-width="1.5"/>

  <!-- Organic Particle Strands (Filamentos de Bezier cúbicos con partículas) -->
  <g class="animated-strand-1" opacity="0.65">
    <!-- Strand 1: Cyan/Emerald Flow -->
    <path d="M -20,110 C 180,60 340,170 520,100 C 650,50 750,130 870,95" fill="none" stroke="url(#strand-cyan)" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Particles on Strand 1 -->
    <circle cx="85" cy="94" r="2.2" fill="#45ffc0" class="node"/>
    <circle cx="195" cy="74" r="3.2" fill="#00f5d4" class="node"/>
    <circle cx="310" cy="142" r="2" fill="#45ffc0"/>
    <circle cx="430" cy="138" r="2.8" fill="#00b4d8" class="node"/>
    <circle cx="560" cy="85" r="3.5" fill="#45ffc0" class="node"/>
    <circle cx="680" cy="88" r="2.2" fill="#00f5d4"/>
    <circle cx="790" cy="118" r="3" fill="#45ffc0" class="node"/>
  </g>

  <g class="animated-strand-2" opacity="0.55">
    <!-- Strand 2: Magenta/Amber Flow -->
    <path d="M -20,165 C 160,210 320,115 480,180 C 620,230 730,140 870,175" fill="none" stroke="url(#strand-magenta)" stroke-width="1.6" stroke-linecap="round"/>
    
    <!-- Particles on Strand 2 -->
    <circle cx="65" cy="178" r="2.5" fill="#ff2097" class="node"/>
    <circle cx="210" cy="188" r="3" fill="#ff6b6b" class="node"/>
    <circle cx="360" cy="132" r="2.2" fill="#ffbe0b"/>
    <circle cx="495" cy="185" r="3.4" fill="#ff6b6b" class="node"/>
    <circle cx="620" cy="215" r="2" fill="#ff2097"/>
    <circle cx="750" cy="155" r="3.2" fill="#ffbe0b" class="node"/>
  </g>

  <!-- Ambient Cosmic Dust (Puntos limpios con colores fijos) -->
  <g opacity="0.5">
    <circle cx="120" cy="35" r="1.2" fill="#ffffff"/>
    <circle cx="250" cy="45" r="1.5" fill="#45ffc0"/>
    <circle cx="390" cy="30" r="1" fill="#ffbe0b"/>
    <circle cx="580" cy="40" r="1.4" fill="#ffffff"/>
    <circle cx="720" cy="30" r="1.8" fill="#ff2097"/>
    <circle cx="140" cy="220" r="1.5" fill="#45ffc0"/>
    <circle cx="290" cy="230" r="1.2" fill="#ffffff"/>
    <circle cx="450" cy="235" r="1.6" fill="#ff6b6b"/>
    <circle cx="630" cy="225" r="1.2" fill="#45ffc0"/>
    <circle cx="780" cy="220" r="1.4" fill="#ffffff"/>
  </g>

  <!-- Top Technical Header: UBICACIÓN Y ESTADO -->
  <g transform="translate(40, 26)">
    <rect width="180" height="22" rx="4" fill="#131722" stroke="#252c3d" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#45ffc0"/>
    <text x="24" y="15" class="mono" font-size="10" font-weight="700" fill="#e6edf3" letter-spacing="1">BOLIVIA • +591</text>
  </g>

  <g transform="translate(630, 26)">
    <rect width="180" height="22" rx="4" fill="#131722" stroke="#252c3d" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#5865f2"/>
    <text x="26" y="15" class="mono" font-size="10" font-weight="700" fill="#c0caf5" letter-spacing="1">DISCORD COMMUNITY</text>
  </g>

  <!-- Main Hero Name (Texto nítido, sin degradados borrosos) -->
  <text x="425" y="95" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">LEONIDAS</text>

  <!-- Role / Subtitle (Color fijo y legible) -->
  <text x="425" y="125" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#7aa2f7" letter-spacing="1.5">SOFTWARE ENGINEER &amp; FULL STACK DEVELOPER</text>

  <!-- Description -->
  <text x="425" y="150" text-anchor="middle" class="sans" font-size="13" font-weight="400" fill="#8b949e">
    Arquitectura Backend • Microservicios • Contenedores • Sistemas Concurrentes
  </text>

  <!-- Bottom Badges Bar (Colores limpios y fijos) -->
  <g transform="translate(70, 182)">
    <!-- C# -->
    <rect x="0" y="0" width="52" height="26" rx="5" fill="#141824" stroke="#512bd4" stroke-width="1.2"/>
    <text x="26" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">C#</text>

    <!-- Python -->
    <rect x="62" y="0" width="70" height="26" rx="5" fill="#141824" stroke="#3776ab" stroke-width="1.2"/>
    <text x="97" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">Python</text>

    <!-- Java -->
    <rect x="142" y="0" width="60" height="26" rx="5" fill="#141824" stroke="#f89820" stroke-width="1.2"/>
    <text x="172" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">Java</text>

    <!-- TypeScript -->
    <rect x="212" y="0" width="94" height="26" rx="5" fill="#141824" stroke="#3178c6" stroke-width="1.2"/>
    <text x="259" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">TypeScript</text>

    <!-- Rust -->
    <rect x="316" y="0" width="85" height="26" rx="5" fill="#1e1310" stroke="#f74c00" stroke-width="1.2"/>
    <text x="358" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f74c00">🦀 Rust</text>

    <!-- Golang -->
    <rect x="411" y="0" width="68" height="26" rx="5" fill="#0d1b24" stroke="#00add8" stroke-width="1.2"/>
    <text x="445" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00add8">Go</text>

    <!-- Podman -->
    <rect x="489" y="0" width="85" height="26" rx="5" fill="#191224" stroke="#892ca0" stroke-width="1.2"/>
    <text x="531" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#d28cf5">Podman</text>

    <!-- Docker -->
    <rect x="584" y="0" width="76" height="26" rx="5" fill="#0e1726" stroke="#2496ed" stroke-width="1.2"/>
    <text x="622" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#2496ed">Docker</text>

    <!-- SQL -->
    <rect x="670" y="0" width="48" height="26" rx="5" fill="#141824" stroke="#45ffc0" stroke-width="1.2"/>
    <text x="694" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#45ffc0">SQL</text>
  </g>
</svg>
