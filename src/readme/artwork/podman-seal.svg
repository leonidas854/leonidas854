<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="seal-title">
<title id="seal-title">Foca de Podman con bufanda morada saludando</title>
<style>
@keyframes seal-wave { 0%,55%,100%{transform:rotate(-12deg)} 20%,40%{transform:rotate(-42deg)} 30%{transform:rotate(-20deg)} }
@keyframes seal-sway { 50%{transform:translateY(-1.5px) rotate(3deg)} }
.podman-seal-wave{transform-origin:56px 47px;animation:seal-wave 3.8s ease-in-out infinite}
.podman-seal-body{transform-origin:40px 67px;animation:seal-sway 3.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.podman-seal-wave,.podman-seal-body{animation:none!important}}
</style>
