name: Generate Contribution Snake

on:
  schedule:
    # Se ejecuta todos los días a medianoche UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Generar animación de la serpiente (Snake SVG)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#116149&color_dots=#73839b,#56749b,#3d5b83,#27456c,#112c50
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#45ffc0&color_dots=#64758f,#8eb7ff,#c4b5ff,#ffce83,#e6edf3

      - name: Ajustar movimiento y generar versiones estáticas
        run: python3 scripts/prepare-snake.py dist

      - name: Publicar SVG en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

