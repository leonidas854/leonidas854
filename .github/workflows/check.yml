name: Check profile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check local links, SVG files and JavaScript modules
        run: python3 scripts/check.py
      - name: Check generated HTML, READMEs and illustrations
        run: |
          python3 scripts/build.py
          python3 scripts/build-assets.py
          git diff --exit-code -- index.html README.md README.en.md assets/
